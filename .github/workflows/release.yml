name: Release

on:
  push:
    branches: [main]
    # Publish only after an explicit release-request marker change.
    paths: [.github/release-request.json]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment; none publishes/retries the current version
        type: choice
        options: [none, patch, minor, major]
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: zmime-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version on the default branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare version
        id: version
        run: python scripts/release.py prepare
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'none' }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}

  validate:
    name: Validate the exact release commit
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish crate, tag and GitHub Release
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - name: Package the tested source
        run: cargo +stable package --locked
      - name: Check provenance, tag and registry state
        id: registry
        run: python scripts/release.py registry-check
      - name: Publish to crates.io
        if: steps.registry.outputs.published != 'true'
        run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Verify registry and finish release
        run: python scripts/release.py finalize
        env:
          GH_TOKEN: ${{ github.token }}
