name: Import zmime source snapshot

on:
  push:
    branches:
      - main
    paths:
      - zmime-0.1.0-source.zip
      - .github/workflows/bootstrap.yml

permissions:
  contents: read

concurrency:
  group: zmime-bootstrap
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source archive and import tracked project files
        env:
          EXPECTED_ARCHIVE_SHA256: be85aaf9b0ec59b6c40614cd4a81e33f19766e5e4c3ff1818f4343b8287d515e
          EXPECTED_SOURCE_COMMIT: 6f1137aa5eeee1894137a3fdf7541b9bddcc4e75
        run: |
          set -euo pipefail

          archive=zmime-0.1.0-source.zip
          printf '%s  %s\\n' "$EXPECTED_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict

          unpack="$RUNNER_TEMP/zmime-source"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"

          source="$unpack/zmime"
          bundle="$source/zmime-history.bundle"
          test -s "$bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/main:refs/remotes/zmime-restore/main

          source_sha="$(git rev-parse refs/remotes/zmime-restore/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_COMMIT"
          git cat-file -e "$source_sha:Cargo.toml"
          git show "$source_sha:Cargo.toml" | grep -Eq '^name = "zmime"$'
          git ls-tree -r --name-only "$source_sha" | grep -Fxq '.github/workflows/ci.yml'

          # Keep this bootstrap workflow unchanged. The GitHub App token used by
          # this runner can write contents but cannot push workflow-file changes.
          mkdir -p "$RUNNER_TEMP/bootstrap"
          cp .github/workflows/bootstrap.yml "$RUNNER_TEMP/bootstrap/bootstrap.yml"

          # Import all project files except workflow definitions and the bundle,
          # which is retained separately as a complete, verifiable history archive.
          rsync -a --exclude='.github/workflows/' --exclude='zmime-history.bundle' "$source/" "$GITHUB_WORKSPACE/"
          mkdir -p verification
          cp "$bundle" verification/zmime-history.bundle
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/bootstrap/bootstrap.yml" .github/workflows/bootstrap.yml

          test -s Cargo.toml
          test -s src/lib.rs
          test -s comparison/Cargo.toml
          test -s verification/zmime-history.bundle
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: import zmime 0.1.0 source snapshot"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push --force-with-lease="refs/heads/main:$GITHUB_SHA" origin HEAD:refs/heads/main
