[package]
name = "zmime"
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
description = "Zero-dependency, zero-allocation, no_std MIME message parsing with lazy decoding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zmime"
readme = "README.md"
keywords = ["mime", "email", "parser", "no-std", "zero-copy"]
categories = ["email", "parsing", "no-std", "embedded"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE-*", "CHANGELOG.md", "Cargo.toml", "Cargo.lock"]

[features]
default = ["simd"]
simd = []

[workspace]
resolver = "3"
exclude = ["comparison"]

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
